[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-intelligence-platform"
version = "0.1.0"
description = "Backend services for the AI Career Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.6",
  "pymupdf>=1.24.0",
  "bcrypt>=4.1.0",
  "PyJWT>=2.8.0",
  "email-validator>=1.3.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "redis>=5.0.0",
  "langgraph>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
